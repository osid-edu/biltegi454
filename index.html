<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Estricto Mobile-First: Evita el zoom accidental al tocar rápidamente -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Buscador Almacén REA</title>
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome (CDN) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Desactivar resaltado táctil nativo en iOS/Android */
        * {
            -webkit-tap-highlight-color: transparent;
        }

        /* Ocultar barra de scroll pero mantener funcionalidad */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Scrollbar sutil para listas largas (desplegables) */
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f8fafc; /* slate-50 */
            border-radius: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1; /* slate-300 */
            border-radius: 8px;
        }

        /* Animaciones suaves */
        .fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Animación del pin del mapa */
        .pin-marker {
            position: absolute;
            width: 0;
            height: 0;
            transition: left 0.5s cubic-bezier(0.4, 0, 0.2, 1), top 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none; /* Que no bloquee clicks debajo */
            z-index: 10;
            filter: drop-shadow(0px 4px 4px rgba(0,0,0,0.3)); /* Sombra consistente sin importar rotación */
        }
        .pin-wrapper {
            position: absolute;
            left: -20px;
            bottom: 0;
            width: 40px;
            height: 40px;
            transform-origin: bottom center;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }
        .pin-top { transform: rotate(0deg); }
        .pin-bottom { transform: rotate(180deg); }
        .pin-right { transform: rotate(90deg); }
        .pin-left { transform: rotate(-90deg); }
        
        .pin-icon {
            animation: pin-bounce 0.8s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
            line-height: 1;
        }
        @keyframes pin-bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-15px); }
        }

        /* Resaltado del módulo en el SVG */
        .highlighted-module {
            transition: fill 0.3s ease, stroke 0.3s ease;
            stroke: #2563EB;
            stroke-width: 4px;
        }

        /* Texto inyectado en el SVG */
        .svg-module-label {
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-weight: 900; /* Extra bold */
            fill: #0f172a; /* slate-900 (Negro suave) */
            pointer-events: none;
            /* Pequeño contorno blanco para asegurar legibilidad en cualquier caso */
            paint-order: stroke;
            stroke: #ffffff;
            stroke-width: 3px;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* =========================================
           AJUSTES DEL CONTENEDOR DEL MAPA Y FULLSCREEN 
           ========================================= */
        
        /* Contenedor relativo que calcada la forma del SVG sin bordes raros */
        #mapContainer {
            aspect-ratio: 1143 / 818;
            position: relative;
            width: 100%;
            background: white;
            border-radius: 0.5rem;
            border: 1px solid #cbd5e1; /* slate-300 */
            overflow: hidden;
            transition: border-radius 0.3s ease;
        }
        
        /* El SVG rellena todo su contenedor padre absolutamente */
        #mapContainer svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        /* Estilos base para la capa de Pantalla Completa */
        #fullscreenOverlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.95); /* slate-900 translúcido */
            backdrop-filter: blur(4px);
            display: none; /* Oculto por defecto */
            overflow: hidden;
        }
        #fullscreenOverlay.active {
            display: block;
        }

        /* El Rotater se encarga de cambiar la orientación según cómo esté el móvil */
        #rotater {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* SI EL MÓVIL ESTÁ EN VERTICAL: Forzar horizontal rotando 90 grados */
        @media (orientation: portrait) {
            #rotater {
                width: 100vh;
                height: 100vw;
                transform: translate(-50%, -50%) rotate(90deg);
            }
        }

        /* SI EL MÓVIL ESTÁ EN HORIZONTAL: Comportamiento natural */
        @media (orientation: landscape) {
            #rotater {
                width: 100vw;
                height: 100vh;
                transform: translate(-50%, -50%);
            }
        }

        /* Adaptaciones del mapa cuando está dentro de Fullscreen */
        #mapContainer.map-maximized {
            border: none;
            border-radius: 0;
            max-width: 95%; /* Un poco de margen respecto a los bordes de la pantalla */
            max-height: 95%;
            background: transparent;
        }
    </style>
</head>

        const rotater = document.getElementById('rotater');

        // ==========================================
        // 2. INICIALIZACIÓN Y CARGA DE DATOS (6 COLUMNAS)
        // ==========================================

        async function initApp() {
            try {
                // Ruta RAW del repositorio de GitHub para obtener el archivo de texto puro
                const csvUrl = 'https://raw.githubusercontent.com/osid-edu/biltegi454/main/ALMACEN454.csv';
                const response = await fetch(csvUrl, { cache: 'no-store' });
                
                if (!response.ok) throw new Error('CSV remoto no encontrado o error de red');
                
                const csvText = await response.text();
                inventoryData = parseCSV(csvText);
            } catch (error) {
                console.warn("Fallo al cargar CSV desde GitHub. Usando datos de prueba (Mock Data).", error);
                inventoryData = MOCK_DATA;
            }
            setupEventListeners();
        }

        function parseCSV(text) {
            const lines = text.split('\n').filter(line => line.trim() !== '');
            const data = [];
            
            // Función auxiliar para limpiar espacios y comillas dobles (típicas de exportaciones Excel/Numbers)
            const clean = (str) => {
                if (!str) return '';
                return str.trim().replace(/^"|"$/g, '').replace(/""/g, '"');
            };

            for (let i = 1; i < lines.length; i++) {
                // Separamos por punto y coma, que es el estándar europeo/español para CSV
                const parts = lines[i].split(';');
                
                if (parts.length >= 6) {
                    data.push({
                        loc: clean(parts[0]),
                        sap: clean(parts[1]),
                        mat: clean(parts[2]),
                        q1: clean(parts[3]),
                        q2: clean(parts[4]),
                        desc: clean(parts[5])
                    });
                }
            }
            return data;
        }

        // ==========================================
        // 3. LÓGICA DE BÚSQUEDA Y NAVEGACIÓN
        // ==========================================

        function setupEventListeners() {
            // Header reset
            mainHeader.addEventListener('click', resetApp);

            // Búsqueda
            searchInput.addEventListener('input', handleSearch);
            clearBtn.addEventListener('click', resetApp);
            
            // Catálogo Completo
            viewAllBtn.addEventListener('click', renderFullList);

            // Listeners para Pantalla Completa
            expandMapBtn.addEventListener('click', openFullscreenMap);
            closeMapBtn.addEventListener('click', closeFullscreenMap);
        }

        // Función auxiliar para eliminar acentos (tildes, diéresis, etc.)
        function removeAccents(str) {
            return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        }

        function resetApp() {
            searchInput.value = '';
            clearBtn.classList.add('hidden');
            clearBtn.classList.remove('flex');
            resultsDropdown.classList.add('hidden');
            detailCard.classList.add('hidden');
            fullListContainer.classList.add('hidden');
            viewAllBtn.classList.remove('hidden');
            searchInput.blur();
        }

        function handleSearch(e) {
            const rawQuery = e.target.value.trim().toLowerCase();
            const query = removeAccents(rawQuery);
            
            // Ocultar catálogo si se empieza a buscar
            fullListContainer.classList.add('hidden');
            viewAllBtn.classList.remove('hidden');
            detailCard.classList.add('hidden');

            if (rawQuery.length > 0) {
                clearBtn.classList.remove('hidden');
                clearBtn.classList.add('flex');
            } else {
                clearBtn.classList.add('hidden');
                clearBtn.classList.remove('flex');
                resultsDropdown.classList.add('hidden');
            }

            if (rawQuery.length < 3) {
                resultsDropdown.classList.add('hidden');
                return;
            }

            // Triple campo de búsqueda: Material (jerga), Descripción (oficial) y SAP
            const results = inventoryData.filter(item => {
                const matClean = removeAccents(item.mat.toLowerCase());
                const descClean = removeAccents(item.desc.toLowerCase());
                const sapClean = removeAccents(item.sap.toLowerCase());
                return matClean.includes(query) || descClean.includes(query) || sapClean.includes(query);
            });

            renderResults(results);
        }

        function renderResults(results) {
            resultsList.innerHTML = '';
            
            if (results.length === 0) {
                resultsList.innerHTML = `<div class="p-4 text-center text-slate-500">No se encontraron resultados.</div>`;
                resultsFooter.classList.add('hidden');
            } else {
                results.forEach(item => {
                    const div = document.createElement('div');
                    div.className = "p-4 hover:bg-slate-50 active:bg-blue-50 cursor-pointer flex justify-between items-center gap-3 transition-colors";
                    div.innerHTML = `
                        <div class="flex-1 min-w-0">
                            <p class="font-bold text-slate-800 truncate text-base">${item.mat}</p>
                            <p class="text-xs text-slate-500 truncate mb-1" title="${item.desc}">${item.desc}</p>
                            <p class="text-sm text-slate-600 font-mono mt-1 flex items-center gap-1.5">
                                <i class="fa-solid fa-barcode text-slate-400"></i> <span class="font-bold">${item.sap}</span>
                            </p>
                        </div>
                        <div class="bg-blue-50 text-blue-800 border border-blue-200 px-3 py-1.5 rounded-lg text-base font-black whitespace-nowrap shadow-sm">
                            ${item.loc}
                        </div>
                    `;
                    div.addEventListener('click', () => selectItem(item));
                    resultsList.appendChild(div);
                });

                resultsFooter.classList.remove('hidden');
                if (results.length > 3) {
                    // Muestra la flecha rebotando si hay necesidad de deslizar
                    resultsFooter.innerHTML = `${results.length} coincidencias <i class="fa-solid fa-arrow-down ml-1 text-blue-500 animate-bounce"></i>`;
                } else {
                    resultsFooter.textContent = `${results.length} coincidencia${results.length !== 1 ? 's' : ''}`;
                }
            }
            resultsDropdown.classList.remove('hidden');
        }

        // ==========================================
        // 4. LÓGICA DEL CATÁLOGO COMPLETO
        // ==========================================

        function renderFullList() {
            // Ocultar otros elementos
            resultsDropdown.classList.add('hidden');
            detailCard.classList.add('hidden');
            viewAllBtn.classList.add('hidden');

            // Ordenar datos por ubicación A-Z
            const sortedData = [...inventoryData].sort((a, b) => a.loc.localeCompare(b.loc));

            fullListBody.innerHTML = '';

            sortedData.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 active:bg-blue-50 cursor-pointer transition-colors";
                tr.innerHTML = `
                    <td class="px-4 py-3 border-r border-slate-100 font-bold text-blue-700 whitespace-nowrap">${item.loc}</td>
                    <td class="px-4 py-3 min-w-[200px] whitespace-normal leading-tight">
                        <div class="font-semibold text-slate-800">${item.mat}</div>
                        <div class="text-xs text-slate-500 mt-0.5">${item.desc}</div>
                    </td>
                    <td class="px-4 py-3 font-mono text-slate-500 whitespace-nowrap border-l border-slate-100">${item.sap}</td>
                `;
                tr.addEventListener('click', () => {
                    fullListContainer.classList.add('hidden'); // Ocultar lista
                    selectItem(item); // Mostrar detalles
                });
                fullListBody.appendChild(tr);
            });

            totalItemsCount.textContent = sortedData.length;
            
            // Mostrar tabla
            fullListContainer.classList.remove('hidden');
            fullListContainer.classList.remove('fade-in');
            void fullListContainer.offsetWidth; // Force reflow
            fullListContainer.classList.add('fade-in');
        }

        // ==========================================
        // 5. LÓGICA DE SELECCIÓN Y UI DEL PIN
        // ==========================================

        function selectItem(item) {
            resultsDropdown.classList.add('hidden');
            viewAllBtn.classList.add('hidden');
            searchInput.blur();

            cardMat.textContent = item.mat;
            cardDesc.textContent = item.desc;
            cardSap.textContent = item.sap;
            cardLoc.textContent = item.loc;
            cardQ1.textContent = item.q1;
            cardQ2.textContent = item.q2;

            updateMapPin(item.loc);

            detailCard.classList.remove('hidden');
            detailCard.classList.remove('fade-in');
            void detailCard.offsetWidth;
            detailCard.classList.add('fade-in');
        }

        function updateMapPin(locationString) {
            // Extraer módulo de "EST1-1" o "EST1/B03" -> "EST1"
            // Ahora divide por '/' o '-' para tolerar los dos sistemas que tienes en tu base de datos
            const moduleName = locationString.split(/[\/\-]/)[0].trim().toUpperCase().replace(/\s+/g, '');
            const targetRect = document.getElementById(moduleName);

            // Elementos de vistas especiales y mapa
            const warehouseMap = document.getElementById('warehouseMap');
            const specialViewVertedero = document.getElementById('specialViewVertedero');
            const specialViewLenceria = document.getElementById('specialViewLenceria');
            const specialViewOficina = document.getElementById('specialViewOficina');
            const specialViewBiombos = document.getElementById('specialViewBiombos');
            const biombosTitle = document.getElementById('biombosTitle');

            // Resetear vistas
            specialViewVertedero.classList.add('hidden');
            specialViewVertedero.classList.remove('flex');
            specialViewLenceria.classList.add('hidden');
            specialViewLenceria.classList.remove('flex');
            specialViewOficina.classList.add('hidden');
            specialViewOficina.classList.remove('flex');
            specialViewBiombos.classList.add('hidden');
            specialViewBiombos.classList.remove('flex');
            
            warehouseMap.style.display = 'block';
            expandMapBtn.style.display = 'flex'; // Mostrar botón Ampliar por defecto

            // Limpiar resaltados y textos previos
            document.querySelectorAll('.highlighted-module').forEach(el => {
                el.classList.remove('highlighted-module');
                if (el.dataset.originalFill) {
                    el.setAttribute('fill', el.dataset.originalFill);
                }
            });
            const oldSvgLabel = document.getElementById('dynamicSvgLabel');
            if (oldSvgLabel) oldSvgLabel.remove();

            // ==========================================
            // CASOS ESPECIALES (Fuera de Almacén Principal)
            // ==========================================
            if (moduleName === 'VERTEDERO') {
                warehouseMap.style.display = 'none';
                expandMapBtn.style.display = 'none'; // No se puede ampliar esta vista
                mapPin.classList.add('hidden');
                specialViewVertedero.classList.remove('hidden');
                specialViewVertedero.classList.add('flex');
                return;
            } else if (moduleName === 'LENCERÍA' || moduleName === 'LENCERIA') {
                warehouseMap.style.display = 'none';
                expandMapBtn.style.display = 'none'; // No se puede ampliar esta vista
                mapPin.classList.add('hidden');
                specialViewLenceria.classList.remove('hidden');
                specialViewLenceria.classList.add('flex');
                return;
            } else if (moduleName === 'OFICINA') {
                warehouseMap.style.display = 'none';
                expandMapBtn.style.display = 'none';
                mapPin.classList.add('hidden');
                specialViewOficina.classList.remove('hidden');
                specialViewOficina.classList.add('flex');
                return;
            } else if (moduleName.startsWith('BIOMBOS')) {
                warehouseMap.style.display = 'none';
                expandMapBtn.style.display = 'none';
                mapPin.classList.add('hidden');
                
                // Extraer el número (BIOMBOS1 -> 1) y formatear el texto visible
                const biomboNumber = moduleName.replace('BIOMBOS', '');
                biombosTitle.textContent = `BIOMBOS ${biomboNumber}`;
                
                specialViewBiombos.classList.remove('hidden');
                specialViewBiombos.classList.add('flex');
                return;
            }

            // ==========================================
            // CASO NORMAL (Módulo en el Mapa SVG)
            // ==========================================
            if (targetRect && targetRect.tagName.toLowerCase() === 'rect') {
                const x = targetRect.x.baseVal.value;
                const y = targetRect.y.baseVal.value;
                const w = targetRect.width.baseVal.value;
                const h = targetRect.height.baseVal.value;

                // Las dimensiones originales del SVG
                const viewBoxWidth = 1143;
                const viewBoxHeight = 818;

                // 1. Determinar la orientación según las reglas del almacén
                let orientation = 'top'; // Por defecto
                const rightModules = ['M01', 'M02', 'M03', 'M04', 'M05', 'M06'];
                const bottomModules = ['TRQ', 'M07', 'M08', 'M09', 'M10', 'M11', 'M12', 'M13'];
                const leftModules = ['EST1', 'EST2', 'EST4', 'EST5'];
                const topModules = ['EST3', 'M14', 'M15', 'M16', 'M17', 'M18'];

                if (rightModules.includes(moduleName)) orientation = 'right';
                else if (bottomModules.includes(moduleName)) orientation = 'bottom';
                else if (leftModules.includes(moduleName)) orientation = 'left';
                else if (topModules.includes(moduleName)) orientation = 'top';

                // 2. Calcular coordenadas exactas del borde de la caja
                let pinX, pinY;
                if (orientation === 'top') {
                    // Centro del borde superior
                    pinX = x + (w / 2);
                    pinY = y;
                } else if (orientation === 'bottom') {
                    // Centro del borde inferior
                    pinX = x + (w / 2);
                    pinY = y + h;
                } else if (orientation === 'right') {
                    // Centro del borde derecho
                    pinX = x + w;
                    pinY = y + (h / 2);
                } else if (orientation === 'left') {
                    // Centro del borde izquierdo
                    pinX = x;
                    pinY = y + (h / 2);
                }

                // Calcular centro en % para posicionar el pin
                const centerX = (pinX / viewBoxWidth) * 100;
                const centerY = (pinY / viewBoxHeight) * 100;

                // Mover el pin al borde calculado
                mapPin.style.left = `${centerX}%`;
                mapPin.style.top = `${centerY}%`;
                
                // Aplicar la rotación adecuada
                const pinWrapper = document.getElementById('pinWrapper');
                pinWrapper.className = `pin-wrapper pin-${orientation}`;
                
                mapPin.classList.remove('hidden');

                // Resaltar Rectángulo
                targetRect.dataset.originalFill = targetRect.getAttribute('fill');
                targetRect.classList.add('highlighted-module');
                targetRect.setAttribute('fill', '#FCD34D'); // Ámbar

                // Inyectar etiqueta de texto GIGANTE directamente en el SVG
                const svgNS = "http://www.w3.org/2000/svg";
                const textNode = document.createElementNS(svgNS, 'text');
                textNode.setAttribute('id', 'dynamicSvgLabel');
                textNode.setAttribute('x', x + (w / 2));
                textNode.setAttribute('y', y + (h / 2));
                textNode.setAttribute('text-anchor', 'middle');
                textNode.setAttribute('dominant-baseline', 'central');
                textNode.setAttribute('class', 'svg-module-label');
                textNode.setAttribute('font-size', '34'); // Escala perfecta para los rectángulos más pequeños
                textNode.textContent = moduleName;
                
                // Lo añadimos justo después del rectángulo en el DOM del SVG para que se dibuje por encima
                targetRect.parentNode.appendChild(textNode);

            } else {
                mapPin.classList.add('hidden');
                console.warn("Módulo no encontrado:", moduleName);
            }
        }

        // ==========================================
        // 6. FUNCIONES PANTALLA COMPLETA
        // ==========================================

        function openFullscreenMap() {
            fullscreenOverlay.classList.add('active');
            mapContainer.classList.add('map-maximized');
            
            // Movemos físicamente el contenedor del mapa al rotador de Fullscreen
            rotater.appendChild(mapContainer);
            
            // Ocultamos el scroll del body de fondo
            document.body.style.overflow = 'hidden';
        }

        function closeFullscreenMap() {
            fullscreenOverlay.classList.remove('active');
            mapContainer.classList.remove('map-maximized');
            
            // Devolvemos el contenedor a su sitio original debajo del título
            originalMapParent.appendChild(mapContainer);
            
            // Restauramos el scroll
            document.body.style.overflow = '';
        }

        // Iniciar
        document.addEventListener('DOMContentLoaded', initApp);

    </script>
</body>
